<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-labelledby="titre desc">
  <title id="titre">Statistiques GitHub</title>
  <desc id="desc">Dépôts publics : 38, Étoiles reçues : 0, Commits (12 derniers mois) : 98, Contributions (12 derniers mois) : 162, Pull requests : 61</desc>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
    .titre { font-size: 18px; font-weight: 600; fill: #60a5fa; }
    .libelle { font-size: 14px; fill: #9198a1; }
    .valeur { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .apparait { opacity: 0; animation: apparait 0.5s ease-out forwards; }
    @keyframes apparait { to { opacity: 1; } }
    .barre { transform-box: fill-box; transform: scaleX(0); animation: grandit 0.8s ease-out forwards; }
    @keyframes grandit { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .apparait, .barre { animation: none; opacity: 1; transform: none; } }
  </style>
  <rect x="0.5" y="0.5" width="439" height="199" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text class="titre" x="25" y="36">Statistiques GitHub</text>
  <g class="apparait" style="animation-delay: 0.00s">
    <circle cx="31" cy="66" r="5" fill="#2563eb"/>
    <text class="libelle" x="45" y="71">Dépôts publics</text>
    <text class="valeur" x="415" y="71" text-anchor="end">38</text>
  </g>
  <g class="apparait" style="animation-delay: 0.15s">
    <circle cx="31" cy="93" r="5" fill="#eab308"/>
    <text class="libelle" x="45" y="98">Étoiles reçues</text>
    <text class="valeur" x="415" y="98" text-anchor="end">0</text>
  </g>
  <g class="apparait" style="animation-delay: 0.30s">
    <circle cx="31" cy="120" r="5" fill="#16a34a"/>
    <text class="libelle" x="45" y="125">Commits (12 derniers mois)</text>
    <text class="valeur" x="415" y="125" text-anchor="end">98</text>
  </g>
  <g class="apparait" style="animation-delay: 0.45s">
    <circle cx="31" cy="147" r="5" fill="#9333ea"/>
    <text class="libelle" x="45" y="152">Contributions (12 derniers mois)</text>
    <text class="valeur" x="415" y="152" text-anchor="end">162</text>
  </g>
  <g class="apparait" style="animation-delay: 0.60s">
    <circle cx="31" cy="174" r="5" fill="#ea580c"/>
    <text class="libelle" x="45" y="179">Pull requests</text>
    <text class="valeur" x="415" y="179" text-anchor="end">61</text>
  </g>
</svg>
