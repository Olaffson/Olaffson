  </g>
  <g class="apparait" style="animation-delay: 0.50s">
    <circle cx="31" cy="118" r="5" fill="#f1e05a"/>
    <text class="libelle" x="43" y="123">JavaScript <tspan class="valeur">13.6 %</tspan></text>
  </g>
  <g class="apparait" style="animation-delay: 0.60s">
    <circle cx="231" cy="118" r="5" fill="#e34c26"/>
