<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-labelledby="titre desc">
  <title id="titre">Langages les plus utilisés</title>
  <desc id="desc">Python : 44.5 %, CSS : 15.1 %, JavaScript : 13.6 %, HTML : 10.7 %, SCSS : 6.3 %, PowerShell : 6.0 %, Autres : 3.8 %</desc>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
    .titre { font-size: 18px; font-weight: 600; fill: #2563eb; }
    .libelle { font-size: 14px; fill: #59636e; }
    .valeur { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .apparait { opacity: 0; animation: apparait 0.5s ease-out forwards; }
    @keyframes apparait { to { opacity: 1; } }
    .barre { transform-box: fill-box; transform: scaleX(0); animation: grandit 0.8s ease-out forwards; }
    @keyframes grandit { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .apparait, .barre { animation: none; opacity: 1; transform: none; } }
  </style>
  <rect x="0.5" y="0.5" width="439" height="199" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text class="titre" x="25" y="36">Langages les plus utilisés</text>
  <clipPath id="arrondi"><rect x="25" y="56" width="390" height="10" rx="5"/></clipPath>
  <g clip-path="url(#arrondi)"><g class="barre"><rect x="25.00" y="56" width="173.37" height="10" fill="#3572A5"/><rect x="198.37" y="56" width="58.82" height="10" fill="#663399"/><rect x="257.19" y="56" width="53.07" height="10" fill="#f1e05a"/><rect x="310.26" y="56" width="41.91" height="10" fill="#e34c26"/><rect x="352.17" y="56" width="24.50" height="10" fill="#c6538c"/><rect x="376.67" y="56" width="23.34" height="10" fill="#012456"/><rect x="400.01" y="56" width="14.99" height="10" fill="#8b949e"/></g></g>
  <g class="apparait" style="animation-delay: 0.30s">
