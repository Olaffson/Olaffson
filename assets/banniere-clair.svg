<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="titre">
  <title id="titre">Olivier Kotwica : Data Analyst / Data Engineer, Python · SQL · Azure, Scraping, ML et MLOps</title>
  <style>
    .nom { font: 700 44px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f2937; }
    .role { font: 500 26px Consolas, 'Courier New', monospace; fill: #2563eb; }
    .curseur { fill: #2563eb; animation: clignote 0.9s steps(1) infinite; }
    @keyframes clignote { 50% { fill-opacity: 0; } }
    .vague { fill: #c7dbff; opacity: 0.6; animation: flotte 8s ease-in-out infinite alternate; }
    @keyframes flotte { to { transform: translateX(-60px); } }
    @media (prefers-reduced-motion: reduce) { .vague, .curseur { animation: none; } }
  </style>
  <defs>
    <clipPath id="carte"><rect width="900" height="220" rx="16"/></clipPath>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0ecff"/>
      <stop offset="1" stop-color="#f5e8ff"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="16" fill="url(#fond)"/>
  <!-- le découpage s'applique au groupe fixe : appliqué à la vague, il se déplacerait avec elle -->
  <g clip-path="url(#carte)">
    <path class="vague" d="M0 185 C 150 150, 300 215, 450 185 S 750 150, 960 185 L 960 220 L 0 220 Z"/>
